server {
    listen 80;
    server_name gauswarn.com;
    return 301 https://gauswarn.com$request_uri;
}

server {
      listen 80;
      server_name www.gauswarn.com;
      return 301 https://gauswarn.com$request_uri;
}

# HTTPS www → HTTPS non-www
server {
    listen 443 ssl;
    server_name www.gauswarn.com;

    ssl_certificate /etc/letsencrypt/live/gauswarn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gauswarn.com/privkey.pem;

    return 301 https://gauswarn.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gauswarn.com;

    ssl_certificate /etc/letsencrypt/live/gauswarn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gauswarn.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    root /home/ubuntu/build;
    index index.html;

    # ========================================================
    # SEO FIXES: Added Trailing Slashes & Parameter Redirection
    # ========================================================

    # A. Remove Trailing Slashes (e.g., /products/ -> /products)
    rewrite ^/(.+)/$ /$1 permanent;

    # B. Strip 'v' Query Parameter (e.g., /products?v=1 -> /products)
    if ($arg_v) {
        set $args ""; 
        rewrite ^(.*)$ $1 permanent; 
    }

    # ========================================================

    location / {
        try_files $uri /index.html;
    }

    # Favicon files — shorter cache to allow Google to pick up changes
    # IMPORTANT: use =404 (not /index.html) so missing favicons return real 404
    location ~* ^/favicon[^/]*\.(ico|png)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(js|css|json|xml)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        gzip_static on;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    location ~* \.(woff2?|ttf|eot)$ {
        expires 6M;
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
}
